<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Franz Fitness">
<meta name="description" content="Franz Fitness: Trainingsplan Woche 1 bis 21 mit Satz-Logger, Streak und Abzeichen. Offline, Daten bleiben auf dem Gerät.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Franz Fitness</title>
<style>:root{--bg:#0e1218;--p:#161c25;--p2:#1c2430;--ln:#2a3442;--tx:#eaf0f6;--mu:#a3b0bf;--te:#3ddc97;--or:#ff9f43;--bl:#4da3ff;--pu:#b99bff;--am:#ffd166;--re:#ff6b6b;--gr:#8798ad;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Noto Sans",sans-serif;font-size:16px;line-height:1.38;-webkit-text-size-adjust:100%}
body{padding:calc(var(--safe-t) + 8px) 0 calc(78px + var(--safe-b))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:#0f151d;border:1.5px solid var(--ln);border-radius:10px;padding:9px 10px;width:100%;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--te)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 10px}
.brand{font-weight:800;font-size:20px;color:var(--te)}
.brand small{display:block;font-size:12px;color:var(--mu);font-weight:500}
.lvl{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:170px;text-align:right}
.lvl b{font-size:13px}
.xpbar{width:140px;height:8px;border-radius:8px;background:var(--ln);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--te),var(--cy,#38d0f0));border-radius:8px}
.card{background:var(--p);border:1.5px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{font-size:18px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h3{font-size:16px;margin-bottom:4px}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;background:#232d3b;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.g{background:#12301f;color:var(--te)}.chip.o{background:#33230f;color:var(--or)}.chip.y{background:#2a2412;color:var(--am)}.chip.b{background:#122338;color:var(--bl)}.chip.r{background:#341616;color:var(--re)}
.row{display:flex;gap:8px;align-items:center}.wrapc{flex-wrap:wrap}.sp{justify-content:space-between}
.hero{background:linear-gradient(135deg,#17283a,#142a22);border-color:#25453a}
.hero .big{font-size:26px;font-weight:800;line-height:1.15}
.unit{display:inline-flex;width:44px;height:44px;border-radius:13px;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#0e1218;flex:none}
.uA{background:var(--or)}.uB{background:var(--bl)}.uH{background:var(--te)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:13px;background:var(--te);color:#0b1a12;font-weight:700;font-size:15px}
.btn.sec{background:#232d3b;color:var(--tx)}.btn.warn{background:#3a1b1b;color:var(--re)}.btn.full{width:100%}
.btn:disabled{opacity:.45}
.seg{display:flex;background:#0f151d;border:1.5px solid var(--ln);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:#232d3b;color:var(--tx)}
.ex{border-top:1px solid #232d3b;padding:12px 0}
.ex:first-of-type{border-top:0}
.exh{display:block}
.exn{font-weight:800;font-size:18px;line-height:1.2}
.figwrap{margin-top:8px;border-radius:16px;overflow:hidden;background:#fff;border:2px solid #fff}
.figbtn{display:block;width:100%;padding:0;background:#fff;line-height:0}
.figbtn svg,.fig{display:block;width:100%;height:auto;background:#fff}
.cued{background:#fff;color:#111}
.cued div{padding:8px 12px 9px;font-size:20px;font-weight:800;line-height:1.15}
.cued b{display:inline-block;min-width:64px;margin-right:6px;color:#9d1020;font-size:15px;letter-spacing:.04em}
.cued div+div{border-top:2px solid #f0f0f0}
.legend{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#111;font-size:15px;font-weight:800;padding:0 10px 10px}
.legend i{width:16px;height:16px;border-radius:4px;background:#d40000;display:block;flex:none}
.sets{margin-top:10px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:6px;align-items:center}
.set .no{font-size:13px;color:var(--mu);text-align:center;font-weight:700}
.set input{padding:8px;text-align:center}
.ok{width:46px;height:40px;border-radius:11px;background:#232d3b;font-size:20px;font-weight:800;color:var(--mu)}
.ok.on{background:var(--te);color:#0b1a12}
.hint{margin-top:8px;font-size:13px;padding:7px 10px;border-radius:10px;background:#2a2412;color:var(--am)}
.hint.g{background:#12301f;color:var(--te)}
.last{font-size:12.5px;color:var(--mu);margin-top:3px}
.tick{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #232d3b}
.tick:first-child{border-top:0}
.box{width:30px;height:30px;border-radius:9px;border:2px solid var(--ln);display:flex;align-items:center;justify-content:center;flex:none;font-weight:900;color:#0b1a12}
.box.on{background:var(--te);border-color:var(--te)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0e1218f2;border-top:1px solid var(--ln);padding:6px 6px calc(6px + var(--safe-b));display:flex;justify-content:space-around;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:4px 8px;min-width:58px}
.nav button.on{color:var(--te)}
.nav svg{width:24px;height:24px}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none}
.timer.on{display:block}
.timer-in{max-width:560px;margin:0 auto;background:#000;color:#fff;border-top:4px solid #ffe14a;border-radius:22px 22px 0 0;padding:12px 12px calc(14px + var(--safe-b));box-shadow:0 -16px 40px #000c}
.timer.full{top:0;z-index:62}
.timer.full .timer-in{max-width:none;min-height:100%;border-radius:0;border-top:0;display:flex;flex-direction:column;justify-content:center;padding:calc(16px + var(--safe-t)) 12px calc(16px + var(--safe-b))}
.timer.satz .timer-in{border-top-color:#5dffb0}
.timer-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer-state{font-size:34px;font-weight:900;letter-spacing:.16em;color:#ffe14a;line-height:1}
.timer.satz .timer-state{color:#5dffb0}
.timer-x{min-width:118px;min-height:56px;padding:8px 12px;border-radius:14px;background:#fff;color:#000;font-weight:800;font-size:18px}
.timer-num{font-size:clamp(96px,31vw,168px);font-weight:900;text-align:center;line-height:.84;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.045em;margin:6px 0 2px}
.timer.full .timer-num{font-size:clamp(120px,34vw,240px)}
.timer-sub{text-align:center;font-size:18px;font-weight:800;color:#fff;line-height:1.25;padding:2px 6px 6px}
.timer .bigbar{height:14px;border-radius:8px;background:#222;overflow:hidden;margin:4px 0 8px}
.timer .bigbar i{display:block;height:100%;background:#ffe14a}
.timer.satz .bigbar i{background:#5dffb0}
.timer-actions{display:flex;gap:8px;margin-top:8px}
.timer-btn{flex:1;min-height:64px;border-radius:16px;background:#fff;color:#000;font-size:20px;font-weight:800}
.timer-btn.go{background:#ffe14a}
.timer.paused #tstart,.timer.satz #tstart{background:#ffe14a}
.timer.satz #tstart{background:#5dffb0}
.zoom{position:fixed;inset:0;z-index:70;background:#fff;display:none;flex-direction:column}
.zoom.on{display:flex}
.zoombar{display:flex;gap:8px;padding:8px 8px 0;background:#0e1218}
.zoombar button{flex:1;min-height:52px;border-radius:12px;background:#fff;color:#111;font-weight:800;font-size:16px}
.zoombar button.on{background:#ffe14a;color:#111}
.zstage{flex:1;overflow:auto;background:#fff;display:flex;align-items:center;justify-content:center;touch-action:none}
.zstage svg{width:100%;height:auto;transform-origin:center center}
.zcues{background:#fff;color:#111;border-top:3px solid #111;padding-bottom:calc(8px + var(--safe-b))}
.zcues div{padding:8px 14px;font-size:24px;font-weight:900;line-height:1.15}
.zcues b{display:inline-block;min-width:72px;margin-right:8px;color:#9d1020;font-size:16px}
.zcues div+div{border-top:2px solid #eee}
.modal{position:fixed;inset:0;background:#000b;z-index:40;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--p);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + var(--safe-b));border:1.5px solid var(--ln)}
.sheet img{width:100%;border-radius:14px;display:block}
.li{display:flex;gap:8px;margin:5px 0;font-size:14.5px}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%) translateY(-120%);background:#12301f;color:var(--te);border:1.5px solid #1f5a3c;padding:10px 16px;border-radius:14px;font-weight:700;z-index:80;transition:transform .3s,opacity .3s;max-width:92vw;text-align:center;opacity:0;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.wk{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid #232d3b}
.wk:first-child{border-top:0}
.wk .n{font-weight:800;font-size:15px;text-align:center;border-radius:10px;height:32px;line-height:32px;background:#232d3b}
.wk .n.ok{background:var(--te);color:#0b1a12}.wk .n.cur{outline:2px solid var(--am)}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:120px}
.dot{width:22px;height:22px;border-radius:7px;background:#232d3b;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.dot.on{background:var(--or);color:#0e1218}.dot.B.on{background:var(--bl)}.dot.H{background:#12301f;color:var(--te)}.dot.H.on{background:var(--te);color:#0b1a12}
.dot.C{background:#12301f;color:var(--te)}.dot.C.on{background:var(--te);color:#0b1a12}
.corebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#12251c;border:1.5px solid #1f5a3c;border-radius:16px;padding:12px;margin:0 0 12px}
.corebar b{font-size:22px;display:block}
.corebar .btn{min-height:56px;min-width:108px;padding:10px 14px;font-size:18px}
.coreprog{position:relative}
.coreprog em{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:#ffd166;border-radius:2px}
.corelist{margin-top:8px}
.core-ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #232d3b}
.core-ex .box{width:48px;height:48px;font-size:24px}
.core-name{flex:1;text-align:left;padding:4px 0}
.core-name b{display:block;font-size:17px}
.core-ex.cur .core-name b{color:var(--te)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{background:var(--p2);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;border:1.5px solid var(--ln)}
.bd .i{font-size:26px;filter:grayscale(1);opacity:.35}
.bd.on{border-color:#1f5a3c;background:#12251c}.bd.on .i{filter:none;opacity:1}
.bd b{display:block;font-size:12.5px;margin-top:2px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--p2);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:11.5px;color:var(--mu)}
.prog{height:10px;border-radius:10px;background:var(--ln);overflow:hidden}.prog i{display:block;height:100%;background:var(--te)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:block;font-size:12.5px;color:var(--mu);margin-bottom:4px}
.note{font-size:13px;color:var(--am);background:#2a2412;border-radius:10px;padding:7px 10px;margin-top:8px}
.quote{font-size:15px;font-weight:700;color:var(--te);text-align:center;padding:6px 8px 2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:6px 4px;border-bottom:1px solid #232d3b;text-align:left}th{color:var(--mu);font-weight:600;font-size:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.days button{padding:7px 0;border-radius:9px;background:#232d3b;font-size:12px;font-weight:700;color:var(--mu)}
.days button.on{background:var(--te);color:#0b1a12}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="timer" id="timer" role="dialog" aria-label="Pausentimer">
  <div class="timer-in">
    <div class="timer-top">
      <div class="timer-state" id="tl">PAUSE</div>
      <button type="button" class="timer-x" id="tclose">Schließen</button>
    </div>
    <div class="timer-num" id="tt">1:30</div>
    <div class="timer-sub" id="tsub"></div>
    <div class="bar bigbar"><i id="tb"></i></div>
    <div class="timer-actions">
      <button type="button" class="timer-btn" id="tstart">Start</button>
      <button type="button" class="timer-btn" id="tstop">Stopp</button>
      <button type="button" class="timer-btn go" id="tskip">Weiter</button>
    </div>
    <div class="timer-actions">
      <button type="button" class="timer-btn" id="tplus">+15 s</button>
      <button type="button" class="timer-btn" id="tfull">Vollbild</button>
    </div>
  </div>
</div>
<div class="zoom" id="zoom" role="dialog" aria-label="Abbildung groß">
  <div class="zoombar">
    <button type="button" id="zboth">Beide</button>
    <button type="button" id="zstart">Nur Start</button>
    <button type="button" id="zend">Nur Ende</button>
  </div>
  <div class="zoombar">
    <button type="button" id="zout">Kleiner</button>
    <button type="button" id="zin">Größer</button>
    <button type="button" id="zclose">Schließen</button>
  </div>
  <div class="zstage" id="zstage"></div>
  <div class="zcues" id="zcues"></div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>
<nav class="nav">
<button data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Heute</button>
<button data-tab="woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Woche</button>
<button data-tab="fort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 4v16h16"/><path d="M7 15l4-4 3 2.5 5-6"/></svg>Fortschritt</button>
<button data-tab="erfolge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5v2a3 3 0 0 0 3 3M16 6h3v2a3 3 0 0 1-3 3M12 13v4M8 20h8M10 17h4"/></svg>Erfolge</button>
<button data-tab="mehr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Mehr</button>
</nav>

    return `<ellipse cx="${r(c[0])}" cy="${r(c[1])}" rx="${r(rx)}" ry="${r(ry)}" fill="${fill}" stroke="${stroke || "#7a0000"}" stroke-width="2" transform="rotate(${r(deg)} ${r(c[0])} ${r(c[1])})"/>`;
  }
  function band(a, b, dir, dist, w, color, t0, t1) {
    const a2 = add(lerp(a, b, t0), mul(dir, dist));
    const b2 = add(lerp(a, b, t1), mul(dir, dist));
    return bone(a2, b2, w, color);
  }
  function poly(pts, fill, stroke) {
    return `<polygon points="${pts.map(p => r(p[0]) + "," + r(p[1])).join(" ")}" fill="${fill}" stroke="${stroke || LINE}" stroke-width="3" stroke-linejoin="round"/>`;
  }

  function torso(hip, sh, front) {
    const u = norm(sub(sh, hip));
    const L = len(sub(sh, hip)) || 1;
    const back = mul(front, -1);
    const rows = [[0.02, 22, 18], [0.42, 16, 15], [0.72, 18, 16], [1, 24, 18]];
    const pf = rows.map(([t, wf]) => add(add(hip, mul(u, L * t)), mul(front, wf)));
    const pb = rows.map(([t, , wb]) => add(add(hip, mul(u, L * t)), mul(back, wb))).reverse();
    return poly(pf.concat(pb), SKIN, LINE);
  }

  function head(hc, face, up) {
    const hairC = add(hc, add(mul(up, 4), mul(face, -6)));
    const ear = add(hc, add(mul(face, -2), mul(up, -4)));
    const eye = add(hc, add(mul(face, 9), mul(up, -2)));
    const n1 = add(hc, add(mul(face, 14), mul(up, -6)));
    const n2 = add(hc, add(mul(face, 24), mul(up, -12)));
    const ang = Math.atan2(up[1], up[0]) * 180 / Math.PI;
    return circ(hairC, 23, HAIR, HAIR) + circ(hc, 22, SKIN) +
      ell(ear, 5.5, 8, ang, SKIN, LINE) +
      circ(eye, 2.6, "#140e0c", "#140e0c") +
      `<line x1="${r(n1[0])}" y1="${r(n1[1])}" x2="${r(n2[0])}" y2="${r(n2[1])}" stroke="${LINE}" stroke-width="3.2" stroke-linecap="round"/>`;
  }

  function shoe(ankle, toe) {
    const back = add(ankle, mul(norm(sub(ankle, toe)), 10));
    const soleA = add(back, [0, 5]);
    const soleB = add(toe, [0, 4]);
    return bone(back, toe, 13, SHOE) +
      `<line x1="${r(soleA[0])}" y1="${r(soleA[1])}" x2="${r(soleB[0])}" y2="${r(soleB[1])}" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>`;
  }

  function dumbbell(x, y, mode) {
    if (mode === "hammer") {
      return `<line x1="${r(x)}" y1="${r(y - 20)}" x2="${r(x)}" y2="${r(y + 20)}" stroke="#c8c8c8" stroke-width="5" stroke-linecap="round"/>` +
        `<line x1="${r(x - 14)}" y1="${r(y - 16)}" x2="${r(x + 14)}" y2="${r(y - 16)}" stroke="#111" stroke-width="9" stroke-linecap="round"/>` +
        `<line x1="${r(x - 14)}" y1="${r(y + 16)}" x2="${r(x + 14)}" y2="${r(y + 16)}" stroke="#111" stroke-width="9" stroke-linecap="round"/>`;
    }
    return `<line x1="${r(x - 12)}" y1="${r(y)}" x2="${r(x + 14)}" y2="${r(y)}" stroke="#bdbdbd" stroke-width="5" stroke-linecap="round"/>` +
      circ([x - 8, y], 13, "#161616", "#000") + circ([x + 8, y], 13, "#0c0c0c", "#000") +
      `<circle cx="${r(x + 8)}" cy="${r(y)}" r="4.5" fill="#d5d5d5"/>`;
  }

  function person(o) {
    const hip = o.hip, sh = o.shoulder;
    const headUp = norm(sub(sh, hip));
    const frontRaw = norm(o.front || [1, 0]);
    const front = snapPerp(hip, sh, frontRaw);
    const back = mul(front, -1);
    const legPrefer = norm(o.legFront || frontRaw);
    const peek = add(mul(back, 10), mul(headUp, 8));
    const hc = add(add(sh, mul(headUp, 38)), mul(front, 2));
    const legs = o.legs || [];
    const arms = o.arms || [];
    const resolved = [];
    let s = "";

    function drawLeg(leg, color) {
      const ghost = !!leg.ghost;
      const knee = ghost ? add(leg.knee, peek) : leg.knee;
      const ankle = ghost ? add(leg.ankle, peek) : leg.ankle;
      const toe = ghost ? add(leg.toe || add(leg.ankle, [26, 10]), peek) : (leg.toe || add(leg.ankle, [26, 10]));
      resolved.push({ kind: "leg", leg, hip, knee, ankle, toe });
      return bone(hip, knee, leg.thin ? 14 : 20, color) + bone(knee, ankle, leg.thin ? 10 : 13, color) + shoe(ankle, toe);
    }
    function drawArm(arm, color) {
      const ghost = !!arm.ghost;
      const elbow = ghost ? add(arm.elbow, peek) : arm.elbow;
      const hand = ghost ? add(arm.hand, peek) : arm.hand;
      resolved.push({ kind: "arm", arm, sh, elbow, hand });
      return bone(sh, elbow, 15, color) + bone(elbow, hand, 11, color) + circ(hand, 8, color);
    }

    legs.filter(l => l.far).forEach(l => { s += drawLeg(l, SKIN2); });
    arms.filter(a => a.far).forEach(a => { s += drawArm(a, SKIN2); });
    s += torso(hip, sh, front);
    legs.filter(l => !l.far).forEach(l => { s += drawLeg(l, SKIN); });
    s += circ(hip, 22, SHORTS, "#000");
    resolved.filter(x => x.kind === "leg").forEach(x => {
      s += bone(hip, lerp(hip, x.knee, 0.46), 22, SHORTS);
    });
    arms.filter(a => !a.far).forEach(a => { s += drawArm(a, SKIN); });
    s += bone(sh, add(sh, mul(headUp, 14)), 13, SKIN);
    s += head(hc, front, headUp);

    const muscles = o.muscles || [];
    const primary = muscles[0];
    const col = m => m === primary ? RED : RED2;
    const ang = Math.atan2(sh[1] - hip[1], sh[0] - hip[0]) * 180 / Math.PI;
    const has = m => muscles.indexOf(m) >= 0;
    if (has("chest")) s += ell(add(lerp(sh, hip, 0.28), mul(front, 8)), 16, 13, ang, col("chest"));
    if (has("abs")) s += ell(add(lerp(sh, hip, 0.64), mul(front, 9)), 11, 16, ang, col("abs"));
    if (has("obliques")) s += ell(add(lerp(sh, hip, 0.56), mul(front, 8)), 14, 16, ang, col("obliques"));
    if (has("lats")) s += ell(add(lerp(sh, hip, 0.4), mul(back, 11)), 16, 26, ang, col("lats"));
    if (has("traps")) s += ell(add(sh, add(mul(back, 4), mul(headUp, 8))), 12, 9, ang, col("traps"));
    if (has("erectors")) s += band(hip, sh, back, 6, 9, col("erectors"), 0.08, 0.72);
    if (has("glutes")) s += circ(add(hip, add(mul(back, 12), mul(headUp, -2))), 13, col("glutes"));
    if (has("fdelt")) s += circ(add(sh, mul(front, 12)), 9, col("fdelt"));
    if (has("rdelt")) s += circ(add(sh, mul(back, 11)), 9, col("rdelt"));
    if (has("mdelt")) s += circ(add(sh, mul(headUp, 12)), 9, col("mdelt"));

    resolved.forEach(part => {
      if (part.arm && part.arm.work === false) return;
      if (part.leg && part.leg.work === false) return;
      if (part.kind === "arm") {
        const dir = snapPerp(part.sh, part.elbow, front);
        if (has("biceps")) s += band(part.sh, part.elbow, dir, 5, 8, col("biceps"), 0.18, 0.78);
        if (has("triceps")) s += band(part.sh, part.elbow, mul(dir, -1), 5, 8, col("triceps"), 0.16, 0.8);
      } else {
        const dir = snapPerp(part.hip, part.knee, legPrefer);
        if (has("quads")) s += band(part.hip, part.knee, dir, 6, 10, col("quads"), 0.4, 0.9);
        if (has("hams")) s += band(part.hip, part.knee, mul(dir, -1), 6, 10, col("hams"), 0.38, 0.88);
      }
    });
    resolved.forEach(part => {
      if (part.kind === "arm" && part.arm.db) s += dumbbell(part.hand[0], part.hand[1], part.arm.db);
    });
    return s;
  }

  function personFront(o) {
    const cx = o.cx, sw = o.sw || 30, hw = o.hw || 22;
    const shL = [cx - sw, o.shY], shR = [cx + sw, o.shY];
    const hipL = [cx - hw, o.hipY], hipR = [cx + hw, o.hipY];
    const muscles = o.muscles || [];
    const primary = muscles[0];
    const col = m => m === primary ? RED : RED2;
    const has = m => muscles.indexOf(m) >= 0;
    let s = "";
    (o.legs || []).forEach(leg => {
      s += bone(leg.hip, leg.knee, 18, SKIN);
      s += bone(leg.knee, leg.ankle, 12, SKIN);
      s += shoe(leg.ankle, leg.toe);
    });
    s += poly([shL, [cx - hw - 4, o.hipY], [cx + hw + 4, o.hipY], shR], SKIN, LINE);
    s += `<rect x="${r(cx - hw - 8)}" y="${r(o.hipY - 8)}" width="${r((hw + 8) * 2)}" height="36" rx="8" fill="${SHORTS}"/>`;
    (o.legs || []).forEach(leg => { s += bone(leg.hip, lerp(leg.hip, leg.knee, 0.42), 20, SHORTS); });
    const hy = o.headY;
    s += circ([cx, hy - 3], 23, HAIR, HAIR);
    s += circ([cx, hy], 22, SKIN);
    s += circ([cx - 8, hy - 1], 2.5, "#140e0c", "#140e0c");
    s += circ([cx + 8, hy - 1], 2.5, "#140e0c", "#140e0c");
    s += `<path d="M ${r(cx - 6)} ${r(hy + 8)} Q ${r(cx)} ${r(hy + 12)} ${r(cx + 6)} ${r(hy + 8)}" fill="none" stroke="${LINE}" stroke-width="2" stroke-linecap="round"/>`;
    (o.arms || []).forEach(arm => {
      s += bone(arm.shoulder, arm.elbow, 14, SKIN);
      s += bone(arm.elbow, arm.hand, 11, SKIN);
      s += circ(arm.hand, 8, SKIN);
    });
    if (has("chest")) {
      s += ell([cx - 12, o.shY + 28], 12, 14, 0, col("chest"));
      s += ell([cx + 12, o.shY + 28], 12, 14, 0, col("chest"));
    }
    if (has("abs")) s += ell([cx, (o.shY + o.hipY) / 2 + 16], 12, 18, 0, col("abs"));
    if (has("obliques")) {
      s += ell([cx - 16, (o.shY + o.hipY) / 2 + 10], 7, 16, 0, col("obliques"));
      s += ell([cx + 16, (o.shY + o.hipY) / 2 + 10], 7, 16, 0, col("obliques"));
    }
    if (has("mdelt")) {
      s += circ(add(shL, [-8, -4]), 10, col("mdelt"));
      s += circ(add(shR, [8, -4]), 10, col("mdelt"));
    }
    if (has("fdelt")) {
      s += circ(add(shL, [6, 6]), 8, col("fdelt"));
      s += circ(add(shR, [-6, 6]), 8, col("fdelt"));
    }
    (o.arms || []).forEach(arm => {
      if (arm.work === false) return;
      const dir = snapPerp(arm.shoulder, arm.elbow, [0, -1]);
      if (has("biceps")) s += band(arm.shoulder, arm.elbow, dir, 4, 7, col("biceps"), 0.2, 0.75);
      if (has("triceps")) s += band(arm.shoulder, arm.elbow, mul(dir, -1), 4, 7, col("triceps"), 0.2, 0.75);
    });
    (o.legs || []).forEach(leg => {
      if (leg.work === false) return;
      const dir = snapPerp(leg.hip, leg.knee, [0, -1]);
      if (has("quads")) s += band(leg.hip, leg.knee, dir, 5, 8, col("quads"), 0.42, 0.88);
    });
    return s;
  }

  function api(parts) {
    const g = {
      raw: s => parts.push(s),
      person: o => parts.push(person(o)),
      front: o => parts.push(personFront(o)),
      floor: y => parts.push(`<line x1="16" y1="${y}" x2="340" y2="${y}" stroke="#e3e3e3" stroke-width="4" stroke-linecap="round"/>`),
      mat: (x, y, w) => parts.push(`<rect x="${x}" y="${y}" width="${w}" height="16" rx="7" fill="#d5dbe3" stroke="#b4bcc6" stroke-width="2"/>`),
      bench: (x, y, len) => parts.push(`<g transform="translate(${x} ${y})"><rect x="0" y="0" width="${len}" height="18" rx="7" fill="${PAD}" stroke="${LINE}" stroke-width="2.5"/><rect x="18" y="18" width="12" height="64" fill="${GEAR}"/><rect x="${len - 30}" y="18" width="12" height="64" fill="${GEAR}"/><rect x="8" y="76" width="32" height="8" rx="2" fill="#111"/><rect x="${len - 40}" y="76" width="32" height="8" rx="2" fill="#111"/></g>`),
      incline: (seatX, seatY, len, deg) => {
        parts.push(`<g transform="translate(${seatX} ${seatY}) rotate(${-deg})"><rect x="${-len}" y="-12" width="${len}" height="20" rx="7" fill="${PAD}" stroke="${LINE}" stroke-width="2.5"/></g>`);
        parts.push(`<rect x="${seatX - 6}" y="${seatY}" width="14" height="72" fill="${GEAR}"/>`);
        parts.push(`<rect x="${seatX - 28}" y="${seatY + 66}" width="64" height="9" rx="2" fill="#111"/>`);
      },
      seat: (x, y) => parts.push(`<rect x="${x}" y="${y - 78}" width="16" height="78" rx="4" fill="${GEAR}"/><rect x="${x}" y="${y - 8}" width="78" height="18" rx="6" fill="${PAD}" stroke="${LINE}" stroke-width="2"/>`),
      tower: (x, y, h) => {
        let stack = "";
        for (let i = 0; i < 5; i++) stack += `<rect x="${x - 8}" y="${y + h - 78 + i * 12}" width="32" height="9" fill="#3a3a3a" stroke="#111"/>`;
        parts.push(`<rect x="${x}" y="${y}" width="16" height="${h}" rx="3" fill="${GEAR}"/>${stack}<circle cx="${x + 8}" cy="${y + 12}" r="8" fill="#111" stroke="#9a9a9a" stroke-width="3"/>`);
      },
      cable: (x1, y1, x2, y2) => parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#5c5c5c" stroke-width="3.5" stroke-linecap="round"/>`),
      bar: (x1, y1, x2, y2) => parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111" stroke-width="8" stroke-linecap="round"/>`),
      rope: (x, y, open) => {
        const s = open ? 18 : 7;
        parts.push(`<line x1="${x}" y1="${y - 6}" x2="${x - s}" y2="${y + 16}" stroke="#222" stroke-width="4" stroke-linecap="round"/><line x1="${x}" y1="${y - 6}" x2="${x + s}" y2="${y + 16}" stroke="#222" stroke-width="4" stroke-linecap="round"/>`);
      },
      db: (x, y, mode) => parts.push(dumbbell(x, y, mode || "plate")),
      pad: (x, y, w, h) => parts.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${PAD}" stroke="${LINE}" stroke-width="2"/>`)
    };
    return g;
  }

  <div class="card"><h2>↔️ Einheit verschieben</h2><div class="grid3"><div><label class="f">Woche</label><select id="shw">${Array.from({ length: 21 }, (_, i) => `<option ${i + 1 === curWeek() ? "selected" : ""}>${i + 1}</option>`).join("")}</select></div>
  <div><label class="f">Einheit</label><select id="shs"><option value="0">1.</option><option value="1">2.</option><option value="2">3. (ab Woche 2)</option></select></div>
  <div><label class="f">Neuer Tag</label><select id="shd">${DAYN.map((d, i) => `<option value="${i}">${d}</option>`).join("")}</select></div></div>
  <button class="btn full" style="margin-top:10px" data-shift>Verschieben</button>
  <div class="xs mu" style="margin-top:6px">Regeln: maximal 1 Nachholtermin pro Woche, nie zwei Tage hintereinander dieselben Muskeln, nie am Tag nach Beinen joggen.</div>
  ${shifts.length ? `<div style="margin-top:8px">${shifts.map(k => { const [w, s] = k.split(":").map(Number); const x = sess(w, s); if (!x) return ""; return `<div class="row sp sm" style="padding:4px 0"><span>Woche ${w}, Einheit ${s + 1} → ${fmtL(x.date)}</span><button class="chip r" data-unshift="${k}">zurücksetzen</button></div>`; }).join("")}</div>` : ""}</div>
  <div class="card"><h2>💾 Daten</h2><div class="sm mu">Alles bleibt auf diesem Gerät (localStorage). Exportiere regelmäßig als Sicherung, z.B. nach jedem Check.</div>
  <div class="grid2" style="margin-top:10px"><button class="btn sec" data-export>Exportieren</button><label class="btn sec">Importieren<input type="file" accept="application/json,.json" data-import style="display:none"></label></div>
  <button class="btn warn full" style="margin-top:8px" data-reset>Alle Daten zurücksetzen</button></div>
  <div class="card"><h2>ℹ️ Über die App</h2><div class="sm">Franz Fitness v4 · Plan Woche 1 bis 21. Tag 1 ist Freitag 20.11.2026 mit Einheit A, Ende Sonntag 11.4.2027. Deload in Woche 12 vom 1.2. bis 7.2.2027. Körperfett in den Wochen 4, 8, 12, 16, 20 und 21. Offline, ohne Konto, ohne Tracker. Übungsbilder sind eigene Skizzen mit rotem Zielmuskel, keine Einweisung. Core Training gibt Tagespunkte und einen Wochenbonus. Alle Zahlen sind Richtwerte, bei Beschwerden Arzt fragen.</div></div>` + historyCard();
}
function historyCard() {
  const a = S.archive;
  if (!a) return "";
  const sessA = a.sessions || [], meas = a.meas || {}, mk = Object.keys(meas);
  if (!sessA.length && !mk.length) return "";
  let h = `<div class="card"><h2>Frühere Einträge</h2><div class="sm mu">Bleiben gespeichert. Einträge vor dem 20.11.2026 zählen nicht als Programmtage.</div>`;
  sessA.forEach(s => {
    const d = s.t ? new Date(s.t) : null;
    const bits = [];
    Object.keys(s.logs || {}).forEach(id => {
      const sets = (s.logs[id] || []).filter(x => x && x.done);
      if (!sets.length) return;
      bits.push((EXD[id] ? EXD[id].name : id) + ": " + sets.map(x => (x.kg ? f1(x.kg, x.kg % 1 ? 1 : 0) + " kg × " : "") + x.r).join(", "));
    });
    h += `<div class="sm" style="margin-top:8px"><b>${d ? fmtL(d) : "Ohne Datum"}</b>${s.done ? " · erledigt" : ""}</div>`;
    if (bits.length) h += `<div class="xs mu">${esc(bits.join(" · "))}</div>`;
  });
  if (mk.length) h += `<div class="xs mu" style="margin-top:8px">${mk.length} Messwerte aus dem vorherigen Kalender bleiben hier und wandern nicht in die neuen Checkwochen.</div>`;
  return h + `</div>`;
}
function guide(id) {
  const e = EXD[id];
  if (!e) return;
  $("#sheet").innerHTML = `<div class="row sp" style="margin-bottom:8px"><h2 style="margin:0;font-size:22px">${esc(e.name)}</h2><button class="btn sec" data-close style="padding:8px 14px;min-height:48px">Schließen</button></div>
  ${figBlock(id)}
  <div class="grid2 sm" style="margin-top:8px"><div><b>Start:</b> ${esc(e.start)}</div><div><b>Ende:</b> ${esc(e.ende)}</div></div>
  <div class="row wrapc" style="gap:4px;margin:10px 0"><span class="chip">${esc(e.plan)}</span><span class="chip">Sätze ${esc(e.saetze)}</span><span class="chip">${esc(e.wl || "Wdh.")} ${esc(e.wdh)}</span><span class="chip">Pause ${esc(e.pause)}</span><span class="chip g">RIR ${esc(e.rir)}</span></div>
  <h3>So geht's</h3>${e.punkte.map(p => `<div class="li"><span style="color:var(--te)">✓</span><span>${esc(p)}</span></div>`).join("")}
  <h3 style="margin-top:8px;color:var(--re)">Typische Fehler</h3>${e.fehler.map(p => `<div class="li"><span>⚠️</span><span>${esc(p)}</span></div>`).join("")}
  <div class="hint" style="margin-top:10px">Zielmuskel: ${esc(e.ziel)}</div>${e.ersatz ? `<div class="hint">Ersatz, wenn der Platz belegt ist oder das Gerät fehlt: ${esc(e.ersatz)}</div>` : ""}<div class="xs mu" style="margin-top:6px">Eigene Skizze, keine Einweisung.</div>`;
  $("#modal").classList.add("on");
}

/* ---------- Events ---------- */
function setLog(k, id, j, field, val) { S.logs[k] = S.logs[k] || {}; const a = S.logs[k][id] = S.logs[k][id] || []; a[j] = a[j] || {}; a[j][field] = val; }
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-tab],[data-open],[data-wk],[data-guide],[data-zoom],[data-set],[data-add],[data-finish],[data-act],[data-coreex],[data-coreshow],[data-wkopen],[data-gow],[data-pw],[data-we],[data-shift],[data-unshift],[data-export],[data-reset],[data-close],#tstop,#tplus,#tstart,#tskip,#tfull,#tclose,#zclose,#zin,#zout,#zboth,#zstart,#zend,#modal");
  if (!t) return;
  const d = t.dataset;
  if (t.id === "modal") { if (ev.target.id === "modal") $("#modal").classList.remove("on"); return; }
  if (d.close !== undefined) { $("#modal").classList.remove("on"); return; }
  if (t.id === "tclose") { closeTimer(); return; }
  if (t.id === "tstop") { pauseTimer(); return; }
  if (t.id === "tstart") { resumeTimer(); return; }
  if (t.id === "tskip") { skipTimer(); return; }
  if (t.id === "tplus") { addTimer(15000); return; }
  if (t.id === "tfull") { const el = $("#timer"); el.classList.toggle("full"); t.textContent = el.classList.contains("full") ? "Zurück" : "Vollbild"; return; }
  if (t.id === "zclose") { closeZoom(); return; }
  if (t.id === "zin") { Z.scale = Math.min(4, +(Z.scale + 0.35).toFixed(2)); paintZoom(); return; }
  if (t.id === "zout") { Z.scale = Math.max(1, +(Z.scale - 0.35).toFixed(2)); paintZoom(); return; }
  if (t.id === "zboth" || t.id === "zstart" || t.id === "zend") { Z.mode = t.id === "zstart" ? "start" : t.id === "zend" ? "end" : "both"; Z.scale = 1; paintZoom(); return; }
  if (d.zoom) { openZoom(d.zoom); return; }
  if (d.tab) { tab = d.tab; render(); scrollTo(0, 0); return; }
  if (d.open) { openK = d.open; render(); $("#sess").scrollIntoView({ behavior: "smooth" }); return; }
  if (d.wk) { openK = d.wk + ":0"; render(); return; }
  if (d.gow) { openK = d.gow + ":0"; tab = "heute"; render(); return; }
  if (d.guide) { guide(d.guide); return; }
  if (d.set) {
    const [k, id, j, p] = d.set.split("|"), jj = +j; S.logs[k] = S.logs[k] || {}; const a = S.logs[k][id] = S.logs[k][id] || []; a[jj] = a[jj] || {};
    const row = t.parentElement, ki = row.querySelector('[data-in$="|kg"]'), ri = row.querySelector('[data-in$="|r"]');
    let kg = num(ki.value), r = parseInt(ri.value, 10);
    if (isNaN(kg) && ki.placeholder && !isNaN(num(ki.placeholder))) kg = num(ki.placeholder);
    if (isNaN(r) && !isNaN(parseInt(ri.placeholder, 10))) r = parseInt(ri.placeholder, 10);
    if (a[jj].done) { a[jj].done = false; save(); render(); return; }
    if (isNaN(r) || r <= 0) { toast("Bitte Wiederholungen eintragen"); ri.focus(); return; }
    const before = records().prs.length;
    a[jj] = { kg: isNaN(kg) ? null : kg, r, done: true, t: Date.now() };
    save(); const after = records().prs.length;
    if (after > before) { confetti(true); toast("🏆 Neue Bestleistung! +" + XP.pr + " XP"); } else toast(CHEERS[Math.floor(Math.random() * CHEERS.length)] + " +" + XP.set + " XP");
    startTimer(+p, timerInfo(k, id, jj)); celebrateCheck(); render(); return;
  }
  if (d.add) { const [k, id] = d.add.split("|"); S.logs[k] = S.logs[k] || {}; const a = S.logs[k][id] = S.logs[k][id] || []; const se = sess(...k.split(":").map(Number)); const idx = UNITS[se.unit].findIndex(u => u.id === id); const n = Math.max(a.length, setsFor(se.w, se.s, idx, se.unit)); a[n] = {}; save(); render(); return; }
  if (d.finish) { const [w, s] = d.finish.split(":").map(Number), se = sess(w, s);
    if (!se) return;
    if (S.done[d.finish]) { delete S.done[d.finish]; if (se.unit === "H") S.act[w + ":hw"] = false; save(); render(); return; }
    S.done[d.finish] = Date.now(); if (se.unit === "H") S.act[w + ":hw"] = true; save(); confetti(false); toast(se.unit === "H" ? "Hotel Held! +" + XP.hotel + " XP" : "Einheit geschafft! +" + XP.session + " XP"); celebrateCheck(); render(); return; }
  if (d.coreex || d.coreshow) {
    const sl = todaySlot(), key = sl.w + ":" + sl.d;
    if (d.coreshow) coreFocus = d.coreshow;
    if (d.coreex) {
      S.core[key] = Object.assign({}, S.core[key] || {});
      if (S.core[key][d.coreex]) delete S.core[key][d.coreex]; else S.core[key][d.coreex] = true;
      coreFocus = d.coreex;
      save();
    }
    render();
    const card = $("#corecard"); if (card) card.scrollIntoView({ block: "nearest" });
    return;
  }
  if (d.act) { const key = d.act;
    if (key.startsWith("done:")) { const k = key.slice(5), [w, s] = k.split(":").map(Number); if (S.done[k]) delete S.done[k]; else S.done[k] = Date.now(); if (sess(w, s) && sess(w, s).unit === "H") S.act[w + ":hw"] = !!S.done[k]; }
    else S.act[key] = !S.act[key];
    save();
    const coreDay = /^\d+:co\d$/.test(key);
    if (coreDay && !S.act[key]) { toast("Core Tag zurückgenommen"); render(); return; }
    if (S.act[key] || key.startsWith("done:")) {
      const big = celebrateCheck();
      if (coreDay && S.act[key] && !big) { confetti(false); toast("Core geschafft! +" + XP.core + " XP"); }
    }
    render(); return; }
  if (d.wkopen) { const w = +d.wkopen; viewWeek = viewWeek === w ? null : w; render(); return; }
  if (d.pw !== undefined) { progWeek = +d.pw; render(); return; }
  if (d.we) { S.set.we = d.we; save(); render(); toast("Dritte Einheit: " + (d.we === "sa" ? "Samstag" : "Sonntag")); return; }
  if (d.shift !== undefined) { const w = +$("#shw").value, s = +$("#shs").value, dd = +$("#shd").value; if (!planSlots(w).some(sl => sl.s === s)) { toast("Diese Einheit gibt es in Woche " + w + " nicht"); return; } S.set.shift[w + ":" + s] = dd; save(); render(); toast("Woche " + w + ": Einheit " + (s + 1) + " auf " + DAYL[dd]); return; }
  if (d.unshift) { delete S.set.shift[d.unshift]; save(); render(); return; }
  if (d.export !== undefined) { exportData(); return; }
  if (d.reset !== undefined) { if (confirm("Wirklich ALLE Daten löschen? Das lässt sich nicht rückgängig machen. Tipp: vorher exportieren.") && confirm("Letzte Sicherheitsfrage: Alles löschen?")) { S = blank(); S.cal = CAL; save(); render(); toast("Daten zurückgesetzt"); } return; }
});
document.addEventListener("change", ev => {
  const t = ev.target, d = t.dataset;
  if (d.in) { const [k, id, j, f] = d.in.split("|"); const v = f === "kg" ? num(t.value) : parseInt(t.value, 10); setLog(k, id, +j, f, isNaN(v) ? null : v); save(); return; }
  if (d.meas) { const v = t.value.trim().replace(".", ","); if (v === "") delete S.meas[d.meas]; else if (isNaN(num(v))) { toast("Bitte eine Zahl eingeben"); return; } else S.meas[d.meas] = v; save(); celebrateCheck(); render(); toast("Gespeichert"); return; }
  if (d.sx !== undefined) { strengthEx = t.value; render(); return; }
  if (d.import !== undefined && t.files[0]) { const r = new FileReader(); r.onload = () => { try { const p = JSON.parse(r.result); if (!p || p.v !== 1 || !p.logs) throw 0; if (confirm("Import ersetzt die aktuellen Daten auf diesem Gerät. Fortfahren?")) { S = Object.assign(blank(), p); S.set = Object.assign({ we: "sa", shift: {} }, p.set || {}); if (!p.cal) delete S.cal; migrate(); ensureShape(); save(); render(); toast("Import erfolgreich"); } } catch (e) { toast("Datei ist kein Franz Fitness Export"); } }; r.readAsText(t.files[0]); t.value = ""; }
});
function exportData() {
  const name = "franz-fitness-" + new Date().toISOString().slice(0, 10) + ".json", blob = new Blob([JSON.stringify(Object.assign({ exportiert: new Date().toISOString(), app: "Franz Fitness v4" }, S), null, 1)], { type: "application/json" });
  try { const f = new File([blob], name, { type: "application/json" }); if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: "Franz Fitness Export" }).catch(() => dl(blob, name)); return; } } catch (e) { }
  dl(blob, name);
}
function dl(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Export erstellt: " + name); }

/* ---------- Start ---------- */
EXDATA.forEach(e => { if (FALLBACK.includes(e.id)) e.fb = true; });
load(); migrate(); if (!S.lvl) S.lvl = xpInfo().lvl;
render();
if (/^https?:/.test(location.protocol)) {
  const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.json"; document.head.appendChild(l);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
}
window.FIG = FIG;
window.FF = { S: () => S, stats, xpInfo, badges, records, okWeek, kraftCount, sess, setsFor, save, load, render, coreCount, coreGoal, coreOk, hasFig: id => FIG.has(id), exerciseIds: () => EXDATA.map(e => e.id) };
(function () {
  const stage = $("#zstage"); if (!stage) return;
  let pinch = null;
  const dist = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY) || 1;
  stage.addEventListener("touchstart", ev => { if (ev.touches.length === 2) pinch = { d: dist(ev.touches), s: Z.scale }; }, { passive: true });
  stage.addEventListener("touchmove", ev => {
    if (ev.touches.length === 2 && pinch) {
      ev.preventDefault();
      Z.scale = Math.min(4, Math.max(1, pinch.s * dist(ev.touches) / pinch.d));
      const svg = stage.querySelector("svg"); if (svg) svg.style.transform = "scale(" + Z.scale + ")";
    }
  }, { passive: false });
  stage.addEventListener("touchend", () => { pinch = null; });
  stage.addEventListener("wheel", ev => {
    if (!$("#zoom").classList.contains("on")) return;
    ev.preventDefault();
    Z.scale = Math.min(4, Math.max(1, Z.scale + (ev.deltaY < 0 ? 0.12 : -0.12)));
    const svg = stage.querySelector("svg"); if (svg) svg.style.transform = "scale(" + Z.scale + ")";
  }, { passive: false });
})();

</script>
