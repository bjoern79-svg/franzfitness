<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Franz Fitness</title>
<style>:root{--bg:#0e1218;--p:#161c25;--p2:#1c2430;--ln:#2a3442;--tx:#eaf0f6;--mu:#a3b0bf;--te:#3ddc97;--or:#ff9f43;--bl:#4da3ff;--pu:#b99bff;--am:#ffd166;--re:#ff6b6b;--gr:#8798ad;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Noto Sans",sans-serif;font-size:16px;line-height:1.38;-webkit-text-size-adjust:100%}
body{padding:calc(var(--safe-t) + 8px) 0 calc(78px + var(--safe-b))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:#0f151d;border:1.5px solid var(--ln);border-radius:10px;padding:9px 10px;width:100%;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--te)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 10px}
.brand{font-weight:800;font-size:20px;color:var(--te)}
.brand small{display:block;font-size:12px;color:var(--mu);font-weight:500}
.lvl{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:170px;text-align:right}
.lvl b{font-size:13px}
.xpbar{width:140px;height:8px;border-radius:8px;background:var(--ln);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--te),var(--cy,#38d0f0));border-radius:8px}
.card{background:var(--p);border:1.5px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{font-size:18px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h3{font-size:16px;margin-bottom:4px}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;background:#232d3b;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.g{background:#12301f;color:var(--te)}.chip.o{background:#33230f;color:var(--or)}.chip.y{background:#2a2412;color:var(--am)}.chip.b{background:#122338;color:var(--bl)}.chip.r{background:#341616;color:var(--re)}
.row{display:flex;gap:8px;align-items:center}.wrapc{flex-wrap:wrap}.sp{justify-content:space-between}
.hero{background:linear-gradient(135deg,#17283a,#142a22);border-color:#25453a}
.hero .big{font-size:26px;font-weight:800;line-height:1.15}
.unit{display:inline-flex;width:44px;height:44px;border-radius:13px;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#0e1218;flex:none}
.uA{background:var(--or)}.uB{background:var(--bl)}.uH{background:var(--te)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:13px;background:var(--te);color:#0b1a12;font-weight:700;font-size:15px}
.btn.sec{background:#232d3b;color:var(--tx)}.btn.warn{background:#3a1b1b;color:var(--re)}.btn.full{width:100%}
.btn:disabled{opacity:.45}
.seg{display:flex;background:#0f151d;border:1.5px solid var(--ln);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:#232d3b;color:var(--tx)}
.ex{border-top:1px solid #232d3b;padding:12px 0}
.ex:first-of-type{border-top:0}
.exh{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.thumb{width:96px;height:54px;border-radius:10px;object-fit:cover;background:#2a3442}
.exn{font-weight:700;font-size:15.5px;line-height:1.2}
.sets{margin-top:10px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:6px;align-items:center}
.set .no{font-size:13px;color:var(--mu);text-align:center;font-weight:700}
.set input{padding:8px;text-align:center}
.ok{width:46px;height:40px;border-radius:11px;background:#232d3b;font-size:20px;font-weight:800;color:var(--mu)}
.ok.on{background:var(--te);color:#0b1a12}
.hint{margin-top:8px;font-size:13px;padding:7px 10px;border-radius:10px;background:#2a2412;color:var(--am)}
.hint.g{background:#12301f;color:var(--te)}
.last{font-size:12.5px;color:var(--mu);margin-top:3px}
.tick{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #232d3b}
.tick:first-child{border-top:0}
.box{width:30px;height:30px;border-radius:9px;border:2px solid var(--ln);display:flex;align-items:center;justify-content:center;flex:none;font-weight:900;color:#0b1a12}
.box.on{background:var(--te);border-color:var(--te)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0e1218f2;border-top:1px solid var(--ln);padding:6px 6px calc(6px + var(--safe-b));display:flex;justify-content:space-around;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:4px 8px;min-width:58px}
.nav button.on{color:var(--te)}
.nav svg{width:24px;height:24px}
.timer{position:fixed;left:10px;right:10px;bottom:calc(70px + var(--safe-b));max-width:540px;margin:0 auto;background:#17283a;border:1.5px solid #2c4a68;border-radius:16px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:21;box-shadow:0 8px 30px #0008}
.timer.on{display:flex}
.timer .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:74px}
.timer .bar{flex:1;height:6px;border-radius:6px;background:#2a3442;overflow:hidden}.timer .bar i{display:block;height:100%;background:var(--bl)}
.modal{position:fixed;inset:0;background:#000b;z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--p);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + var(--safe-b));border:1.5px solid var(--ln)}
.sheet img{width:100%;border-radius:14px;display:block}
.li{display:flex;gap:8px;margin:5px 0;font-size:14.5px}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%) translateY(-120%);background:#12301f;color:var(--te);border:1.5px solid #1f5a3c;padding:10px 16px;border-radius:14px;font-weight:700;z-index:40;transition:transform .3s,opacity .3s;max-width:92vw;text-align:center;opacity:0;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.wk{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid #232d3b}
.wk:first-child{border-top:0}
.wk .n{font-weight:800;font-size:15px;text-align:center;border-radius:10px;height:32px;line-height:32px;background:#232d3b}
.wk .n.ok{background:var(--te);color:#0b1a12}.wk .n.cur{outline:2px solid var(--am)}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:120px}
.dot{width:22px;height:22px;border-radius:7px;background:#232d3b;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.dot.on{background:var(--or);color:#0e1218}.dot.B.on{background:var(--bl)}.dot.H{background:#12301f;color:var(--te)}.dot.H.on{background:var(--te);color:#0b1a12}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{background:var(--p2);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;border:1.5px solid var(--ln)}
.bd .i{font-size:26px;filter:grayscale(1);opacity:.35}
.bd.on{border-color:#1f5a3c;background:#12251c}.bd.on .i{filter:none;opacity:1}
.bd b{display:block;font-size:12.5px;margin-top:2px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--p2);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:11.5px;color:var(--mu)}
.prog{height:10px;border-radius:10px;background:var(--ln);overflow:hidden}.prog i{display:block;height:100%;background:var(--te)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:block;font-size:12.5px;color:var(--mu);margin-bottom:4px}
.note{font-size:13px;color:var(--am);background:#2a2412;border-radius:10px;padding:7px 10px;margin-top:8px}
.quote{font-size:15px;font-weight:700;color:var(--te);text-align:center;padding:6px 8px 2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:6px 4px;border-bottom:1px solid #232d3b;text-align:left}th{color:var(--mu);font-weight:600;font-size:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.days button{padding:7px 0;border-radius:9px;background:#232d3b;font-size:12px;font-weight:700;color:var(--mu)}
.days button.on{background:var(--te);color:#0b1a12}
</style>
</head>

  ${shifts.length ? `<div style="margin-top:8px">${shifts.map(k => { const [w, s] = k.split(":").map(Number); const x = sess(w, s); return `<div class="row sp sm" style="padding:4px 0"><span>Woche ${w}, Einheit ${s + 1} → ${fmtL(x.date)}</span><button class="chip r" data-unshift="${k}">zurücksetzen</button></div>`; }).join("")}</div>` : ""}</div>
  <div class="card"><h2>💾 Daten</h2><div class="sm mu">Alles bleibt auf diesem Gerät (localStorage). Exportiere regelmäßig als Sicherung, z.B. nach jedem Check.</div>
  <div class="grid2" style="margin-top:10px"><button class="btn sec" data-export>Exportieren</button><label class="btn sec">Importieren<input type="file" accept="application/json,.json" data-import style="display:none"></label></div>
  <button class="btn warn full" style="margin-top:8px" data-reset>Alle Daten zurücksetzen</button></div>
  <div class="card"><h2>ℹ️ Über die App</h2><div class="sm">Franz Fitness v1 · Plan Woche 1 bis 21 (Mo 2.11.2026 bis So 28.3.2027). Offline, ohne Konto, ohne Tracker. Übungsbilder sind Illustrationen, keine Einweisung. Alle Zahlen sind Richtwerte, bei Beschwerden Arzt fragen.</div></div>`;
}
function guide(id) {
  const e = EXD[id];
  $("#sheet").innerHTML = `<div class="row sp" style="margin-bottom:8px"><h2 style="margin:0;font-size:19px">${esc(e.name)}</h2><button class="btn sec" data-close style="padding:6px 12px">✕</button></div>
  <img src="${IMG[id]}" alt="${esc(e.name)}: Start und Ende"><div class="grid2 sm" style="margin-top:6px"><div><b>1 Start:</b> ${esc(e.start)}</div><div><b>2 Ende:</b> ${esc(e.ende)}</div></div>
  <div class="row wrapc" style="gap:4px;margin:10px 0"><span class="chip">${esc(e.plan)}</span><span class="chip">Sätze ${esc(e.saetze)}</span><span class="chip">${esc(e.wl || "Wdh.")} ${esc(e.wdh)}</span><span class="chip">Pause ${esc(e.pause)}</span><span class="chip g">RIR ${esc(e.rir)}</span></div>
  <h3>So geht's</h3>${e.punkte.map(p => `<div class="li"><span style="color:var(--te)">✓</span><span>${esc(p)}</span></div>`).join("")}
  <h3 style="margin-top:8px;color:var(--re)">Typische Fehler</h3>${e.fehler.map(p => `<div class="li"><span>⚠️</span><span>${esc(p)}</span></div>`).join("")}
  <div class="hint" style="margin-top:10px">🎯 Zielmuskel: ${esc(e.ziel)}</div>${e.fb ? '<div class="xs mu" style="margin-top:6px">Bild: schematische Zeichnung.</div>' : ""}`;
  $("#modal").classList.add("on");
}

/* ---------- Events ---------- */
function setLog(k, id, j, field, val) { S.logs[k] = S.logs[k] || {}; const a = S.logs[k][id] = S.logs[k][id] || []; a[j] = a[j] || {}; a[j][field] = val; }
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-tab],[data-open],[data-wk],[data-guide],[data-set],[data-add],[data-finish],[data-act],[data-wkopen],[data-gow],[data-pw],[data-we],[data-shift],[data-unshift],[data-export],[data-reset],[data-close],#tstop,#tplus,#modal");
  if (!t) return;
  const d = t.dataset;
  if (t.id === "modal") { if (ev.target.id === "modal") $("#modal").classList.remove("on"); return; }
  if (d.close !== undefined) { $("#modal").classList.remove("on"); return; }
  if (t.id === "tstop") { clearInterval(T.iv); $("#timer").classList.remove("on"); return; }
  if (t.id === "tplus") { T.end += 15000; T.len += 15; return; }
  if (d.tab) { tab = d.tab; render(); scrollTo(0, 0); return; }
  if (d.open) { openK = d.open; render(); $("#sess").scrollIntoView({ behavior: "smooth" }); return; }
  if (d.wk) { openK = d.wk + ":0"; render(); return; }
  if (d.gow) { openK = d.gow + ":0"; tab = "heute"; render(); return; }
  if (d.guide) { guide(d.guide); return; }
  if (d.set) {
    const [k, id, j, p] = d.set.split("|"), jj = +j; S.logs[k] = S.logs[k] || {}; const a = S.logs[k][id] = S.logs[k][id] || []; a[jj] = a[jj] || {};
    const row = t.parentElement, ki = row.querySelector('[data-in$="|kg"]'), ri = row.querySelector('[data-in$="|r"]');
    let kg = num(ki.value), r = parseInt(ri.value, 10);
    if (isNaN(kg) && ki.placeholder && !isNaN(num(ki.placeholder))) kg = num(ki.placeholder);
    if (isNaN(r) && !isNaN(parseInt(ri.placeholder, 10))) r = parseInt(ri.placeholder, 10);
    if (a[jj].done) { a[jj].done = false; save(); render(); return; }
    if (isNaN(r) || r <= 0) { toast("Bitte Wiederholungen eintragen"); ri.focus(); return; }
    const before = records().prs.length;
    a[jj] = { kg: isNaN(kg) ? null : kg, r, done: true, t: Date.now() };
    save(); const after = records().prs.length;
    if (after > before) { confetti(true); toast("🏆 Neue Bestleistung! +" + XP.pr + " XP"); } else toast(CHEERS[Math.floor(Math.random() * CHEERS.length)] + " +" + XP.set + " XP");
    startTimer(+p); celebrateCheck(); render(); return;
  }
  if (d.add) { const [k, id] = d.add.split("|"); S.logs[k] = S.logs[k] || {}; const a = S.logs[k][id] = S.logs[k][id] || []; const se = sess(...k.split(":").map(Number)); const idx = UNITS[se.unit].findIndex(u => u.id === id); const n = Math.max(a.length, setsFor(se.w, se.s, idx, se.unit)); a[n] = {}; save(); render(); return; }
  if (d.finish) { const [w, s] = d.finish.split(":").map(Number), se = sess(w, s);
    if (S.done[d.finish]) { delete S.done[d.finish]; if (se.unit === "H") S.act[w + ":hw"] = false; save(); render(); return; }
    S.done[d.finish] = Date.now(); if (se.unit === "H") S.act[w + ":hw"] = true; save(); confetti(false); toast(se.unit === "H" ? "Hotel Held! +" + XP.hotel + " XP" : "Einheit geschafft! +" + XP.session + " XP"); celebrateCheck(); render(); return; }
  if (d.act) { const key = d.act;
    if (key.startsWith("done:")) { const k = key.slice(5), [w, s] = k.split(":").map(Number); if (S.done[k]) delete S.done[k]; else S.done[k] = Date.now(); if (sess(w, s).unit === "H") S.act[w + ":hw"] = !!S.done[k]; }
    else S.act[key] = !S.act[key];
    save(); if (S.act[key] || key.startsWith("done:")) celebrateCheck(); render(); return; }
  if (d.wkopen) { const w = +d.wkopen; viewWeek = viewWeek === w ? null : w; render(); return; }
  if (d.pw !== undefined) { progWeek = +d.pw; render(); return; }
  if (d.we) { S.set.we = d.we; save(); render(); toast("Dritte Einheit: " + (d.we === "sa" ? "Samstag" : "Sonntag")); return; }
  if (d.shift !== undefined) { const w = +$("#shw").value, s = +$("#shs").value, dd = +$("#shd").value; S.set.shift[w + ":" + s] = dd; save(); render(); toast("Woche " + w + ": Einheit " + (s + 1) + " auf " + DAYL[dd]); return; }
  if (d.unshift) { delete S.set.shift[d.unshift]; save(); render(); return; }
  if (d.export !== undefined) { exportData(); return; }
  if (d.reset !== undefined) { if (confirm("Wirklich ALLE Daten löschen? Das lässt sich nicht rückgängig machen. Tipp: vorher exportieren.") && confirm("Letzte Sicherheitsfrage: Alles löschen?")) { S = blank(); save(); render(); toast("Daten zurückgesetzt"); } return; }
});
document.addEventListener("change", ev => {
  const t = ev.target, d = t.dataset;
  if (d.in) { const [k, id, j, f] = d.in.split("|"); const v = f === "kg" ? num(t.value) : parseInt(t.value, 10); setLog(k, id, +j, f, isNaN(v) ? null : v); save(); return; }
  if (d.meas) { const v = t.value.trim().replace(".", ","); if (v === "") delete S.meas[d.meas]; else if (isNaN(num(v))) { toast("Bitte eine Zahl eingeben"); return; } else S.meas[d.meas] = v; save(); celebrateCheck(); render(); toast("Gespeichert"); return; }
  if (d.sx !== undefined) { strengthEx = t.value; render(); return; }
  if (d.import !== undefined && t.files[0]) { const r = new FileReader(); r.onload = () => { try { const p = JSON.parse(r.result); if (!p || p.v !== 1 || !p.logs) throw 0; if (confirm("Import ersetzt die aktuellen Daten auf diesem Gerät. Fortfahren?")) { S = Object.assign(blank(), p); S.set = Object.assign({ we: "sa", shift: {} }, p.set || {}); save(); render(); toast("Import erfolgreich"); } } catch (e) { toast("Datei ist kein Franz Fitness Export"); } }; r.readAsText(t.files[0]); t.value = ""; }
});
function exportData() {
  const name = "franz-fitness-" + new Date().toISOString().slice(0, 10) + ".json", blob = new Blob([JSON.stringify(Object.assign({ exportiert: new Date().toISOString(), app: "Franz Fitness v1" }, S), null, 1)], { type: "application/json" });
  try { const f = new File([blob], name, { type: "application/json" }); if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: "Franz Fitness Export" }).catch(() => dl(blob, name)); return; } } catch (e) { }
  dl(blob, name);
}
function dl(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Export erstellt: " + name); }

/* ---------- Start ---------- */
EXDATA.forEach(e => { if (FALLBACK.includes(e.id)) e.fb = true; });
load(); if (!S.lvl) S.lvl = xpInfo().lvl;
render();
if (/^https?:/.test(location.protocol)) {
  const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.json"; document.head.appendChild(l);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
}
window.FF = { S: () => S, stats, xpInfo, badges, records, okWeek, kraftCount, sess, setsFor, save, load, render };

</script>
</body>
</html>
